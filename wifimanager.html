<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Venus | WiFi Manager
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0b1020,
                    #171a35,
                    #24134a
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

        }


        .card {

            width: 100%;

            max-width: 500px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.15);

            border-radius: 24px;

            padding: 35px;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.4);

            backdrop-filter:
                blur(15px);

        }


        .brand {

            font-size: 16px;

            font-weight: bold;

            letter-spacing: 3px;

            color: #7de7ff;

            margin-bottom: 10px;

        }


        h1 {

            margin:
                0 0 10px;

            font-size: 34px;

        }


        .subtitle {

            color: #b9bfd7;

            line-height: 1.6;

            margin-bottom: 30px;

        }


        label {

            display: block;

            margin:
                18px 0 8px;

            font-weight: bold;

            color: #e8eaff;

        }


        input {

            width: 100%;

            padding:
                14px 15px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.18);

            background:
                rgba(0,0,0,0.25);

            color: white;

            outline: none;

            font-size: 15px;

        }


        input:focus {

            border-color:
                #7de7ff;

        }


        .note {

            margin-top: 18px;

            padding: 14px;

            border-radius: 12px;

            background:
                rgba(125,231,255,0.08);

            color: #cbd2ea;

            font-size: 13px;

            line-height: 1.5;

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: 0;

            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #5ee7ff,
                    #7774ff
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.9;

        }


    </style>

</head>


<body>


    <div class="card">


        <div class="brand">
            VENUS
        </div>


        <h1>
            WiFi Manager
        </h1>


        <div class="subtitle">

            Connect your ESP32 to the WiFi
            network used by the Venus
            DHT11 realtime monitor.

        </div>


        <form
            method="POST"
            action="/save"
        >


            <label for="ssid">
                WiFi SSID
            </label>

            <input
                type="text"
                id="ssid"
                name="ssid"
                placeholder="Enter WiFi name"
                required
            >


            <label for="password">
                WiFi Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter WiFi password"
            >


            <label for="ip">
                Static IP
            </label>

            <input
                type="text"
                id="ip"
                name="ip"
                placeholder="Optional"
            >


            <label for="gateway">
                Gateway
            </label>

            <input
                type="text"
                id="gateway"
                name="gateway"
                placeholder="Optional"
            >


            <div class="note">

                Leave <b>Static IP</b> and
                <b>Gateway</b> blank if you want
                the ESP32 to use automatic DHCP.

                <br><br>

                ESP32 WiFi normally requires
                a <b>2.4 GHz</b> network.

            </div>


            <button type="submit">
                SAVE & CONNECT
            </button>


        </form>


    </div>


</body>

</html>
